name: tc-diag
on:
  push:
    branches: [fix/team-cloud-linux-ci]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: env
        run: |
          which bwrap socat || true; bwrap --version || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          ls /etc/apparmor.d | grep -i bwrap || true
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp /bin/true; echo probe=$?
          echo node=$(which node); echo tmp=$TMPDIR
      - name: box self-check
        continue-on-error: true
        run: node server/bot-box/box-check.ts
      - name: preference e2e with logs
        continue-on-error: true
        env: { DUSK_FIXTURE_DUMP: "1" }
        run: pnpm exec vitest run server/cloud-team-preference.e2e.test.ts 2>&1 | tail -400
      - name: required box unit
        continue-on-error: true
        run: pnpm exec vitest run server/bot-box/required.test.ts 2>&1 | tail -60
